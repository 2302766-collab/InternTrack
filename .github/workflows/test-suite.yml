name: Test Suite

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_DATABASE: interntrack_test
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -psecret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate
      
      - name: Run backend tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          php artisan test \
            tests/Feature/AdminDashboardTest.php \
            tests/Feature/AdminStudentListingTest.php \
            tests/Feature/ApiFoundationTest.php \
            tests/Feature/AuthFlowTest.php \
            tests/Feature/StudentInternshipProfileTest.php \
            tests/Feature/StudentLogSubmissionTest.php \
            tests/Feature/StudentAttachmentFlowTest.php



  flutter-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run widget tests with per-file timing
        run: |
          set -euo pipefail

          mapfile -t test_files < <(
            find test -name "*_test.dart" \
              ! -name "login_form_validation_test.dart" \
              ! -name "login_validation_direct_test.dart" \
              ! -name "simple_validation_test.dart" \
              | sort
          )

          suite_started_at=$(date +%s)

          for file in "${test_files[@]}"; do
            echo "::group::flutter test ${file}"
            file_started_at=$(date +%s)

            timeout 8m flutter test --reporter expanded "$file"

            file_finished_at=$(date +%s)
            echo "Completed ${file} in $((file_finished_at - file_started_at))s"
            echo "::endgroup::"
          done

          suite_finished_at=$(date +%s)
          echo "Completed Flutter test suite in $((suite_finished_at - suite_started_at))s"
