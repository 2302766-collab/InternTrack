name: Test Suite

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_DATABASE: interntrack_test
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -psecret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate
      
      - name: Run backend tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          ./vendor/bin/phpunit \
            tests/Feature/AdminDashboardTest.php \
            tests/Feature/AdminStudentListingTest.php \
            tests/Feature/ApiFoundationTest.php \
            tests/Feature/AuthFlowTest.php \
            tests/Feature/StudentInternshipProfileTest.php \
            tests/Feature/StudentLogSubmissionTest.php \
            tests/Feature/StudentAttachmentFlowTest.php
